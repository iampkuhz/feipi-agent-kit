# Feipi Agent Kit — Harness Manifest
# Auto-generated. Do not edit manually unless registering new resources.

version: "0.1.0"
name: "feipi-agent-kit"
description: "AI 工程助手仓库 — skills / tools / rules / commands 的创建、更新与验证"

# ---------------------------------------------------------------------------
# Entrypoints — AI agent 启动时加载的核心文档
# ---------------------------------------------------------------------------
entrypoints:
  - path: "AGENTS.md"
    type: "core-constraints"
    description: "核心约束与入口（强约束、目录路由、DoD）"
  - path: "CLAUDE.md"
    type: "detail"
    description: "详细说明（渐进式加载入口）"
  - path: "README.md"
    type: "overview"
    description: "仓库总览"
  - path: "docs/agent-handbook.md"
    type: "handbook"
    description: "Agent 操作手册"
  - path: "rules/README.md"
    type: "rules-index"
    description: "规则索引"

# ---------------------------------------------------------------------------
# Rules — 行为规则（仅已存在的文件）
# ---------------------------------------------------------------------------
rules:
  - path: "rules/global/language.md"
    scope: "global"
    description: "语言使用规范（中文优先）"

# ---------------------------------------------------------------------------
# Commands — 当前无已启用 command
# ---------------------------------------------------------------------------
commands:
  enabled: false
  readme: "commands/README.md"

# ---------------------------------------------------------------------------
# Skills — 从唯一索引读取
# ---------------------------------------------------------------------------
skill_registry: "skills/registry.yaml"

# ---------------------------------------------------------------------------
# Workflows — 已定义的工作流
# ---------------------------------------------------------------------------
workflows:
  - name: "skill-govern"
    path: "harness/workflows/skill-govern.yaml"
    description: "Skill 治理工作流（创建、审查、校验）"
  - name: "diagram-generate"
    path: "harness/workflows/diagram-generate.yaml"
    description: "PlantUML / Mermaid / draw.io 图表生成工作流"

# ---------------------------------------------------------------------------
# Validation — harness 级一致性检查（由 scripts/harness/doctor.sh 执行）
# ---------------------------------------------------------------------------
validation:
  - name: "validate_rules"
    script: "scripts/harness/validate_rules.py"
    description: "rules/ 一致性检查"
  - name: "validate_commands"
    script: "scripts/harness/validate_commands.py"
    description: "commands/ 一致性检查"
  - name: "validate_registry"
    script: "scripts/harness/validate_registry.py"
    description: "skills/registry.yaml 一致性检查"
  - name: "validate_manifest"
    script: "scripts/harness/validate_manifest.py"
    description: "harness/manifest.yaml 一致性检查"

# ---------------------------------------------------------------------------
# Local Config — 用户个人配置，不可模板化
# ---------------------------------------------------------------------------
local_config:
  files:
    - path: ".claude/settings.local.json"
      description: "Claude Code 本地配置（用户个人设置）"
    - path: ".mcp.json"
      description: "MCP 服务配置（用户个人 MCP 列表）"
  policy: "这些文件属于用户个人本地配置，保持原样，不纳入模板或 manifest 管理"
