# Workflow: Diagram Generation
# 按用户指定的图表格式选择入口。

workflow:
  name: "diagram-generate"
  version: "0.1.0"
  description: "PlantUML / Mermaid / draw.io 图表生成工作流"

  # 触发条件
  triggers:
    - "需要生成或修改 Mermaid / .mmd 图表时"
    - "需要生成或修改 draw.io / diagrams.net / .drawio 图表时"
    - "需要生成 PlantUML 架构图时"
    - "需要生成 PlantUML 时序图时"
    - "需要生成其他 PlantUML 图表时"

  # 引用的 skill
  referenced_skills:
    - name: "feipi-mermaid-generate-diagram"
      path: "skills/diagram/feipi-mermaid-generate-diagram/SKILL.md"
      role: "Mermaid 入口"
    - name: "feipi-drawio-generate-diagram"
      path: "skills/diagram/feipi-drawio-generate-diagram/SKILL.md"
      role: "draw.io 入口"
    - name: "feipi-plantuml-generate-diagram"
      path: "skills/diagram/feipi-plantuml-generate-diagram/SKILL.md"
      role: "PlantUML 入口"

  # 路由逻辑
  routing:
    default: "feipi-plantuml-generate-diagram"
    mermaid: "feipi-mermaid-generate-diagram"
    drawio: "feipi-drawio-generate-diagram"

  # 校验步骤
  steps:
    - name: "validate-diagram-package"
      description: "由对应 skill 校验源文件、覆盖、布局与真实本地渲染产物"
      required: true

    - name: "check-template-usage"
      description: "检查是否使用了正确的模板"
      required: true

  # 输出
  outputs:
    - type: "diagram"
      description: "生成的 PlantUML、Mermaid 或 draw.io 源文件及渲染图路径"
    - type: "validation"
      description: "校验结果"
