name: fastmcp

services:
  gateway:
    image: localhost/feipi/fastmcp-gateway:local
    build:
      context: ../../../../runtimes/fastmcp
      dockerfile: Containerfile
    container_name: fastmcp-gateway
    environment:
      MCP_HOST: 0.0.0.0
      SEARXNG_URL: http://host.containers.internal:8873
    ports:
      - "127.0.0.1:18080:18080"
    restart: unless-stopped
