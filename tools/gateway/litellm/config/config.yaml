# LiteLLM 配置
# 定位：统一多模型代理，简洁配置，适合个人本地使用
# 观测：不强制依赖任何本地观测组件，未来可通过 OTel 接入云端平台

model_list:
  - model_name: litellm-code-openai
    litellm_params:
      # 百炼 OpenAI 兼容端点
      model: openai/qwen-plus
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: dummy-key

  - model_name: litellm-code-anthropic
    litellm_params:
      # 百炼 Anthropic 兼容端点
      model: anthropic/qwen-plus
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: dummy-key

  - model_name: litellm-autocomplate-openai
    litellm_params:
      # 本地 OMLX 端点
      model: openai/qwen-turbo
      api_base: http://host.containers.internal:11434/v1
      api_key: dummy-key

  # Codex / Responses API
  # 只走 ChatGPT Subscription provider。默认值由 docker-compose.yml 提供：
  # LITELLM_CODEX_MODEL=codex-chatgpt
  # LITELLM_UPSTREAM_CODEX_MODEL=chatgpt/gpt-5.5
  - model_name: os.environ/LITELLM_CODEX_MODEL
    model_info:
      mode: responses
    litellm_params:
      model: os.environ/LITELLM_UPSTREAM_CODEX_MODEL

# Codex CLI 会发送自己的原生模型名。这里把这些名字映射到同一个
# ChatGPT 订阅转发模型，避免客户端必须改成自定义的 codex-chatgpt。
router_settings:
  model_group_alias:
    gpt-5.3-codex: os.environ/LITELLM_CODEX_MODEL
    gpt-5.3-codex-spark: os.environ/LITELLM_CODEX_MODEL
    gpt-5.4: os.environ/LITELLM_CODEX_MODEL
    gpt-5.4-mini: os.environ/LITELLM_CODEX_MODEL
    gpt-5.5: os.environ/LITELLM_CODEX_MODEL
    gpt-5.2: os.environ/LITELLM_CODEX_MODEL

# ===== LiteLLM 运行时设置 =====
# 这里不能只保留注释而没有实际键值；YAML 会把 `litellm_settings` 解析成 null，
# LiteLLM 1.81.x 的 Playground / Team 配置读取路径会直接对其调用 `.get(...)`，
# 从而触发 `'NoneType' object has no attribute 'get'`。
litellm_settings:
  success_callback: []
  failure_callback: []
  default_team_settings: {}

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
  database_connection_pool_limit: 5
  proxy_batch_write_at: 2
  store_prompts_in_spend_logs: true
  max_request_size_mb: 16
  max_response_size_mb: 32
  maximum_spend_logs_retention_period: "1d"
  maximum_spend_logs_retention_interval: "1d"
