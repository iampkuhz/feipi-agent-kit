# LiteLLM 轻量代理 - Docker Compose 配置
# 定位：本地 AI 模型网关，低内存占用
# 依赖：PostgreSQL（用于存储配置、日志、元数据）
# 健康检查：4000 端口可访问即视为健康

# 固定 Compose 项目名，避免多个 tools/**/compose 目录都落到默认的 compose 项目下。
name: litellm

services:
  # PostgreSQL 数据库 - LiteLLM 必需的最小依赖
  postgres:
    image: docker.io/postgres:17
    container_name: litellm-db-podman
    hostname: litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm_password}
      POSTGRES_DB: litellm
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - type: bind
        source: /Users/zhehan/Documents/service-data/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks:
      litellm_network:
        aliases:
          - litellm-db

  # LiteLLM Proxy - 模型网关
  litellm:
    image: docker.litellm.ai/berriai/litellm:v1.89.0
    container_name: litellm-proxy-podman
    restart: unless-stopped
    mem_limit: 2048m
    mem_reservation: 1024m
    pids_limit: 256
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # ===== 只保留需要从宿主机传入的少量变量 =====
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-local-dev}
      LITELLM_SALT_KEY: sk-litellm-local-salt
      # Codex / Responses API 在 config.yaml 中按标准模型名严格转发到 chatgpt/...。
      # 代理：使用 LiteLLM 专用变量，避免继承宿主机 HTTP_PROXY/https_proxy。
      # 默认指向宿主机代理端口；如需禁用，在当前 shell 环境中把 LITELLM_CONTAINER_*_PROXY 设为空字符串。
      HTTP_PROXY: ${LITELLM_CONTAINER_HTTP_PROXY-http://host.containers.internal:7890}
      HTTPS_PROXY: ${LITELLM_CONTAINER_HTTPS_PROXY-http://host.containers.internal:7890}
      http_proxy: ${LITELLM_CONTAINER_HTTP_PROXY-http://host.containers.internal:7890}
      https_proxy: ${LITELLM_CONTAINER_HTTPS_PROXY-http://host.containers.internal:7890}
      NO_PROXY: 127.0.0.1,localhost,litellm-db,postgres,host.containers.internal
      no_proxy: 127.0.0.1,localhost,litellm-db,postgres,host.containers.internal
      # ChatGPT Subscription OAuth token 持久化
      CHATGPT_TOKEN_DIR: /app/chatgpt-tokens
      # Podman Compose 不保证 container_name 自动成为可解析别名，
      # 这里固定使用 postgres 服务暴露出的 litellm-db 网络别名连接数据库。
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:-litellm_password}@litellm-db:5432/litellm
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
      # 绕过有问题的迁移检查路径
      - "--use_prisma_db_push"
    volumes:
      - ../config/config.yaml:/app/config.yaml:ro
      # ChatGPT OAuth token 持久化目录（宿主机 <-> 容器）
      - type: bind
        source: /Users/zhehan/Documents/service-data/litellm/chatgpt-tokens
        target: /app/chatgpt-tokens
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - litellm_network

# 定义网络
networks:
  litellm_network:
    driver: bridge
