# Crawl4AI Service - Docker Compose 配置
# 定位：Web 内容抓取和提取服务

# 固定 Compose 项目名，避免多个 tools/**/compose 目录都落到默认的 compose 项目下。
name: crawl4ai

services:
  crawl4ai:
    image: docker.io/unclecode/crawl4ai:0.8.6
    container_name: crawl4ai
    ports:
      - "11235:11235"
    environment:
      - NO_PROXY=127.0.0.1,localhost,0.0.0.0,::1,host.containers.internal
      - no_proxy=127.0.0.1,localhost,0.0.0.0,::1,host.containers.internal
      # 普通抓取保持直连。需使用本机代理时，按部署环境启用这两项。
      # - HTTP_PROXY=http://host.containers.internal:7890
      # - HTTPS_PROXY=http://host.containers.internal:7890
      # 可选的 LLM 接口沿用调用进程提供的已导出变量。
      - LLM_PROVIDER
      - LLM_API_KEY
    volumes:
      - ../config/config.yml:/app/config.yml:ro
    # 使用容器自己的共享内存，不依赖宿主机 /dev/shm 路径。
    shm_size: 1gb
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
