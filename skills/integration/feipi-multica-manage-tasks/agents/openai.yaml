version: 2
interface:
  display_name: "Multica 任务协作"
  short_description: "记录、查询和静默回写 Multica 任务，明确派发、跨工具交接并提交持久验收证据。"
  default_prompt: "请使用 $feipi-multica-manage-tasks，先区分讨论、记录与启动执行，复用 multica-work 和 multica-task，核对当前启用角色、Issue、机器、runtime、目录及项目规则。后台缺任务认证时停止；进度用 /note，真正交接用正常回复并保留当前 run 的真实触发评论 parent。复用固定 request-id，预检失败修复缺口后重试，pending 先 recover 取证。交付与本次执行一致的产物、实际验证结果及未验证事项。"
