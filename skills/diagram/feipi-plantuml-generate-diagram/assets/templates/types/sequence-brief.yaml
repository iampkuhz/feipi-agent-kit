# 时序图需求模板
#
# 使用方式：
# 1. 复制本文件，替换所有尖括号占位符。
# 2. 执行校验：bash scripts/validate_package.sh --diagram-type sequence --brief your-brief.yaml --diagram your-diagram.puml --out-dir <dir>
#    或手动校验：python3 scripts/lib/validate_brief_cli.py your-brief.yaml --schema assets/validation/types/sequence-brief.schema.json
# 3. 校验通过后，再根据 brief 生成 PlantUML。

diagram_id: <diagram-id>
diagram_type: sequence
# interaction_mr（默认）使用 M/R；process_s 使用 Sx/Sx.y，禁止混用。
numbering_scheme: interaction_mr
title: "<图标题>"
summary: "<这张图要表达的核心交互流程>"

participants:
  - id: user
    name: <用户或发起方>
    type: actor
    description: <参与者职责>
  - id: service_a
    name: <服务 A>
    type: participant
    description: <参与者职责>
  - id: service_b
    name: <服务 B>
    type: participant
    description: <参与者职责>
  - id: db_a
    name: <数据库 A>
    type: database
    description: <参与者职责>

messages:
  - id: M1
    from: user
    to: service_a
    description: <消息描述>
    type: sync
  - id: M2
    from: service_a
    to: service_b
    description: <消息描述>
    type: sync
  - id: M3
    from: service_b
    to: db_a
    description: <消息描述>
    type: sync
  - id: R1
    from: service_b
    to: service_a
    description: <返回描述>
    type: return

layout:
  direction: top_to_bottom
  include_legend: false

groups:
  - id: frontend
    name: <前端层>
    participants: [user]
  - id: backend
    name: <后端层>
    participants: [service_a, service_b]
    separator: true
  - id: data
    name: <数据层>
    participants: [db_a]

out_of_scope:
  - <明确不进入图中的内容>
