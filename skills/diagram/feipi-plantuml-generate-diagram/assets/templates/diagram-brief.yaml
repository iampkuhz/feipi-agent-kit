# PlantUML 图需求模板
#
# 使用方式：
# 1. 复制本文件，替换所有尖括号占位符。
# 2. 设置 diagram_type 为已注册类型（architecture / sequence / component / activity / deployment）。
# 3. 校验通过后，再根据 brief 生成 PlantUML。

diagram_id: <diagram-id>
diagram_type: <architecture|sequence|component|activity|deployment>
title: "<图标题>"
summary: "<这张图要表达的核心内容>"

# 以下为 typed profile 特定字段，按 diagram_type 填写
# architecture: layers, components, flows
# sequence: participants, groups, messages
# component: view, groups, nodes, relations
# activity: steps, transitions, narrative_step_ids
# deployment: zones, nodes, connections, boundary_triggers

layout:
  direction: top_to_bottom

out_of_scope:
  - <明确不进入图中的内容>
