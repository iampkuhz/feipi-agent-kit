#!NAME = OIX-Region-Priority.conf
#!DESC = 香港→日本→新加坡→美国→全球备用；地区内自动选择
#!CONFIG = oixCloud.yaml
# oixCloud 地区优先：香港 → 日本 → 新加坡 → 美国 → 全球备用
# 仅关联 /etc/openclash/config/oixCloud.yaml，勿关联三毛或全部配置。
# 应用后在 Zashboard 的 Proxy 中选择一次「地区优先」。
[YAML]
proxy-providers:
  oixCloud:
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
      timeout: 5000
      lazy: false
      expected-status: 204

# 复用原有全节点自动组作为最后一级备用，统一测试地址。
proxy-groups*:
  where:
    name: /^(Auto - UrlTest|全球自动)$/
  set:
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: false
    timeout: 5000
    expected-status: 204
    empty-fallback: REJECT

# 只在现有 Proxy 选择器前面增加自动入口；原来的手选项仍可使用。
<proxy-groups>*:
  where:
    name: Proxy
  set:
    +proxies:
      - 地区优先

proxy-groups+:
  - name: 地区优先
    type: fallback
    proxies:
      - 香港自动
      - 日本自动
      - 新加坡自动
      - 美国自动
      - Auto - UrlTest
    url: https://cp.cloudflare.com/generate_204
    interval: 60
    timeout: 5000
    lazy: false
    expected-status: 204
    empty-fallback: REJECT

  - name: 香港自动
    type: url-test
    use: [oixCloud]
    filter: 香港
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 5000
    lazy: false
    expected-status: 204
    empty-fallback: REJECT

  - name: 日本自动
    type: url-test
    use: [oixCloud]
    filter: 日本
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 5000
    lazy: false
    expected-status: 204
    empty-fallback: REJECT

  - name: 新加坡自动
    type: url-test
    use: [oixCloud]
    filter: 新加坡
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 5000
    lazy: false
    expected-status: 204
    empty-fallback: REJECT

  - name: 美国自动
    type: url-test
    use: [oixCloud]
    filter: 美国
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 5000
    lazy: false
    expected-status: 204
    empty-fallback: REJECT

# 订阅仍使用原名称；输出运行配置时同步重命名组及其引用。
[Overwrite]
ruby_edit "$CONFIG_FILE" "['proxy-groups']" 'Value["proxy-groups"].map { |g| g["name"] = "全球自动" if g["name"] == "Auto - UrlTest"; g["proxies"] = g["proxies"].map { |n| n == "Auto - UrlTest" ? "全球自动" : n }.uniq if g["proxies"].is_a?(Array); g }.uniq { |g| g["name"] }'
